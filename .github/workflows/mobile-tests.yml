name: Mobile App - PD Forms Tests

on:
  push:
    branches: [main, develop, formfactor]
    paths:
      - 'apps/mobile/**'
      - 'apps/backend/src/modules/loan/forms-schema/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - 'apps/backend/src/modules/loan/forms-schema/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    name: Run Mobile App Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Run linter
        working-directory: apps/mobile
        run: npm run lint --if-present

      - name: Run unit tests
        working-directory: apps/mobile
        run: npm run test:unit

      - name: Run component tests
        working-directory: apps/mobile
        run: npm run test:components

      - name: Run integration tests
        working-directory: apps/mobile
        run: npm run test:integration

      - name: Run all banks test suite
        working-directory: apps/mobile
        run: npm run test:all-banks

      - name: Generate coverage report
        working-directory: apps/mobile
        run: npm run test:coverage

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v3
        with:
          files: apps/mobile/coverage/lcov.info
          flags: mobile
          name: mobile-coverage
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            apps/mobile/coverage/
            apps/mobile/__tests__/reports/

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('apps/mobile/coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;
            
            const comment = `## 🧪 Test Results
            
            | Metric | Coverage |
            |--------|----------|
            | Statements | ${total.statements.pct}% |
            | Branches | ${total.branches.pct}% |
            | Functions | ${total.functions.pct}% |
            | Lines | ${total.lines.pct}% |
            
            ✅ All PD forms tests passed!
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: comment
            });

  all-banks-validation:
    name: Validate All 27 Banks
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Run comprehensive bank validation
        working-directory: apps/mobile
        run: npm run test:all-banks -- --verbose

      - name: Generate test report
        if: always()
        working-directory: apps/mobile
        run: |
          echo "# PD Forms Test Report" > test-report.md
          echo "" >> test-report.md
          echo "**Generated:** $(date)" >> test-report.md
          echo "" >> test-report.md
          echo "All 27 banks tested successfully! ✅" >> test-report.md

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bank-validation-report
          path: apps/mobile/test-report.md

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [test, all-banks-validation]
    if: always()

    steps:
      - name: Send Slack notification (success)
        if: needs.test.result == 'success' && needs.all-banks-validation.result == 'success'
        run: |
          echo "✅ All mobile tests passed!"
          # Add actual Slack webhook here
          # curl -X POST -H 'Content-type: application/json' \
          # --data '{"text":"✅ Mobile PD Forms Tests: All 27 banks passed!"}' \
          # ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack notification (failure)
        if: needs.test.result == 'failure' || needs.all-banks-validation.result == 'failure'
        run: |
          echo "❌ Some mobile tests failed!"
          # Add actual Slack webhook here
          # curl -X POST -H 'Content-type: application/json' \
          # --data '{"text":"❌ Mobile PD Forms Tests: Some tests failed. Check GitHub Actions for details."}' \
          # ${{ secrets.SLACK_WEBHOOK_URL }}

