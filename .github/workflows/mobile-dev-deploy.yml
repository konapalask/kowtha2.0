name: CI/CD - Revopush

on:
  push:
    branches: [ revopush-cicd,development ]      # or whichever branch triggers deployments
  #workflow_dispatch:        # allows manual workflow runs from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --force

    - name: Add missing module
      run: npm install react-native-uuid

    - name: Clear Metro cache
      run: npx react-native start --reset-cache & sleep 5; kill $!

    - name: Setup Revopush CLI
      uses: revopush/revopush-github-action@v1
      with:
        version: 'latest'
        accessKey: ${{ secrets.REVOPUSH_ACCESS_KEY }}

    - name: Release Android bundle
      run: revopush release-react kowtha-app android -d Staging --target-binary-version "*" --des "Force redeploy" --mandatory   # customize app name and env

    #- name: Release iOS bundle
    #  run: revopush release-react MyAwesomeApp ios -d Staging        # customize app name and env
